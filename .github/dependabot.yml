version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      electron:
        patterns: ['electron', 'electron-builder']
      editor:
        patterns: ['@milkdown/*', '@codemirror/*', 'codemirror', '@lezer/*']
      markdown-pipeline:
        patterns: ['unified', 'remark-*', 'rehype-*', 'katex', 'dompurify']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/test', '@testing-library/*', 'jsdom']
      tooling:
        patterns:
          [
            'typescript',
            'typescript-eslint',
            'eslint',
            '@eslint/*',
            'eslint-plugin-*',
            'prettier',
            'vite',
            '@vitejs/*',
            'globals',
            '@types/node',
          ]
      other:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
