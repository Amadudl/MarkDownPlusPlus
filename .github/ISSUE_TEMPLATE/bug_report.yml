name: Bug report
description: Something in MarkDown++ does not work as expected.
title: '[Bug]: '
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search
        [existing issues](https://github.com/Amadudl/MarkDownPlusPlus/issues) first.

        **Security vulnerabilities must not be reported here.** Follow
        [SECURITY.md](https://github.com/Amadudl/MarkDownPlusPlus/blob/main/SECURITY.md) instead.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reproduce the problem.
      placeholder: |
        1. Open a new document
        2. Switch to Visual mode (WYSIWYG)
        3. Insert a table via the slash menu
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: markdown
    attributes:
      label: Sample Markdown
      description: If the bug depends on document content, paste the smallest Markdown that triggers it.
      render: markdown

  - type: dropdown
    id: mode
    attributes:
      label: Editor mode
      options:
        - Visual mode (WYSIWYG)
        - Markdown mode (source)
        - Switching between modes
        - Not editor related
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MarkDown++ version
      description: Shown in Help → About MarkDown++.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows (x64)
        - Windows (arm64)
        - Linux (x64)
        - Linux (arm64)
    validations:
      required: true

  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      options:
        - Installer (dmg / setup.exe / deb / rpm)
        - Portable (zip / portable.exe / AppImage / tar.gz)
        - Built from source
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 26.1, Windows 11 24H2, Ubuntu 24.04, ...

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste relevant output (for example from the developer tools console) or attach screenshots.
      render: text
