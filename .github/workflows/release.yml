name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, format, type-check and unit tests
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test:coverage

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

  # electron-builder creates the GitHub release itself when none exists. With three packaging
  # jobs running in parallel, two of them could each create a separate draft for the same
  # tag and split the artifacts between them, so the draft is created once, up front.
  draft-release:
    name: Create draft release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the draft release the packaging jobs upload into
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --repo "$REPO" --draft --verify-tag \
              --title "MarkDown++ ${TAG#v}" \
              --notes "Packages are being built and uploaded by the release workflow."
          fi

  package:
    name: Package (${{ matrix.os }})
    needs: [verify, draft-release]
    # Also runs for manual (workflow_dispatch) runs, where no draft release is created.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.draft-release.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
      # Build provenance attestations (Sigstore, keyless) for the packaged files.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y rpm

      # No lifecycle scripts run in this job: it later handles the signing secrets, so a
      # compromised dependency must not get a chance to execute code at install time.
      # Packaging does not need any install script (electron-builder downloads the
      # Electron distribution itself), and the Electron binary is not used here.
      - name: Install dependencies (without lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Build application bundles
        run: npm run build

      # Signing credentials are optional and are scoped to the single packaging step of
      # the matching OS: they are never written to $GITHUB_ENV, so no other step (and no
      # third-party action) can read them. Empty secrets are unset so that forks and
      # unsigned releases still build. Secrets are passed through the environment,
      # never inlined into the script.
      - name: Package and publish to a draft GitHub release (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Code signing: enabled"
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "Code signing: disabled (no CSC_LINK secret); the app is ad-hoc signed"
          fi
          if [ -n "${CSC_LINK:-}" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Notarisation: enabled"
          else
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            echo "Notarisation: disabled (credentials incomplete)"
          fi
          npx --no-install electron-builder --publish always

      - name: Package and publish to a draft GitHub release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then
            echo "Code signing: enabled"
          else
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "Code signing: disabled (no WIN_CSC_LINK secret)"
          fi
          npx --no-install electron-builder --publish always

      - name: Package and publish to a draft GitHub release (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install electron-builder --publish always

      # Instead of a paid code-signing certificate, every download gets a free, verifiable
      # SLSA build provenance attestation: `gh attestation verify <file> --repo <owner/repo>`
      # proves that the file was built by this workflow from this repository and commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/latest*.yml
          retention-days: 30
          if-no-files-found: error

  checksums:
    name: Publish checksums
    needs: package
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Attach SHA256SUMS.txt for all downloads to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir downloads && cd downloads
          gh release download "$TAG" --repo "$REPO" --pattern 'MarkDownPlusPlus-*'
          find . -maxdepth 1 -type f -name 'MarkDownPlusPlus-*' ! -name '*.blockmap' -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$REPO" --clobber
