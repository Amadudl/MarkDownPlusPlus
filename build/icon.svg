<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>MarkDown++</title>
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7C83FF"/>
      <stop offset="0.48" stop-color="#6246EA"/>
      <stop offset="1" stop-color="#3B1E9E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="0" y1="310" x2="0" y2="730">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E1FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#12083F" flood-opacity="0.32"/>
    </filter>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1B0B5C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Tile: 824 x 824 on the macOS icon grid (100 px transparent margin). -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- "M" + down arrow: the Markdown mark. -->
  <g filter="url(#glyphShadow)" transform="translate(18 16)">
    <path d="M232 700 V372 L372 530 L512 372 V700" fill="none" stroke="url(#glyph)" stroke-width="92"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M688 372 V612" fill="none" stroke="url(#glyph)" stroke-width="92" stroke-linecap="round"/>
    <path d="M588 566 H788 L688 704 Z" fill="url(#glyph)" stroke="url(#glyph)" stroke-width="28"
          stroke-linejoin="round"/>
  </g>

  <!-- "++" accent badge. -->
  <g filter="url(#glyphShadow)">
    <rect x="590" y="166" width="258" height="136" rx="68" fill="url(#accent)"/>
    <path d="M640 234 H696 M668 206 V262 M742 234 H798 M770 206 V262" fill="none" stroke="#3B1E9E"
          stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
